<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Fighter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Edit Fighter</h2>

    <form th:action="@{/save-fighter}"
          th:object="${fighter}"
          method="post">

        <!-- Hidden ID -->
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label>Name</label>
            <input type="text" class="form-control" th:field="*{name}">
        </div>

        <div class="mb-3">
            <label>Nickname</label>
            <input type="text" class="form-control" th:field="*{nickname}">
        </div>

        <div class="mb-3">
            <label>Nationality</label>
            <input type="text" class="form-control" th:field="*{nationality}">
        </div>

        <div class="mb-3">
            <label>Weight Class</label>
            <input type="text" class="form-control" th:field="*{weightClass}">
        </div>

        <div class="mb-3">
            <label>Wins</label>
            <input type="number" class="form-control" th:field="*{wins}">
        </div>

        <div class="mb-3">
            <label>Losses</label>
            <input type="number" class="form-control" th:field="*{losses}">
        </div>

        <div class="mb-3">
            <label>Draws</label>
            <input type="number" class="form-control" th:field="*{draws}">
        </div>

        <div class="mb-3">
            <label>Image URL</label>
            <input type="text" class="form-control" th:field="*{imageUrl}">
        </div>

        <div class="mb-3">
            <label>About URL</label>
            <input type="text" class="form-control" th:field="*{aboutUrl}">
        </div>

        <button type="submit" class="btn btn-primary">
            Update Fighter
        </button>

        <a href="/fighters-page" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
