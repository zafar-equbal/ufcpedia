
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFCPEDIA | Hall of Fame</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#0b0b0b;color:#fff;overflow-x:hidden}
        .hero{background:linear-gradient(135deg,#111,#1b1b1b);padding:70px 0;border-bottom:2px solid #E10600;text-align:center}
        .hero h1{color:#FFD700;font-weight:800}
        .hero p{color:#ccc}
        .legend-card{background:#181818;border:1px solid #333;border-radius:20px;overflow:hidden;height:100%;transition:.35s}
        .legend-card:hover{transform:translateY(-8px);border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,.35)}
        .legend-card img{width:100%;height:330px;object-fit:cover}
        .ribbon{display:inline-block;background:#FFD700;color:#000;padding:8px 16px;border-radius:25px;font-weight:700;margin-bottom:15px}
        .record{background:#222;border-radius:12px;padding:10px;margin:15px 0}
        .btn-legacy{background:#E10600;color:#fff}.btn-legacy:hover{background:#b30000;color:#fff}
        .gold{color:#FFD700}
        @media(max-width:768px){.hero{padding:45px 20px}.hero h1{font-size:2rem}.legend-card img{height:260px}}
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<section class="hero">
    <div class="container">
        <h1> UFC Hall of Fame</h1>
        <p>The greatest legends to ever step inside the Octagon.</p>
    </div>
</section>
<div class="container py-5">
    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="fighter : ${legends}">
            <div class="legend-card">
                <img th:src="${fighter.imageUrl}" alt="Legend">
                <div class="p-4 text-center">
                    <div class="ribbon"> Hall of Fame</div>
                    <h3 class="fw-bold" th:text="${fighter.name}"></h3>
                    <p class="text-danger" th:text="${fighter.nickname}"></p>
                    <p> <span th:text="${fighter.nationality}"></span></p>
                    <p> <span th:text="${fighter.title != null ? fighter.title : 'Former UFC Fighter'}"></span></p>
                    <div class="record">
                        <strong>Record</strong><br>
                        <span th:text="${fighter.wins}"></span> -
                        <span th:text="${fighter.losses}"></span> -
                        <span th:text="${fighter.draws}"></span>
                    </div>
                    <p class="gold">Hall of Fame Class <strong th:text="${fighter.hallOfFameYear}"></strong></p>
                    <p th:if="${fighter.retired}" class="text-secondary">Retired UFC Legend</p>
                    <div class="d-grid mt-3">
                        <a class="btn btn-legacy" th:href="@{/fighter/{id}(id=${fighter.id})}">View Legacy</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
