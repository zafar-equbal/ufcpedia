<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Add Event</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <h2 class="mb-4">➕ Add UFC Event</h2>

  <form th:action="@{/save-event}" th:object="${event}" method="post">
    <input type="hidden" th:field="*{id}">

    <div class="mb-3">
      <label>Event Name</label>
      <input type="text" class="form-control" th:field="*{name}" required>
    </div>

    <div class="mb-3">
      <label>Location</label>
      <input type="text" class="form-control" th:field="*{location}">
    </div>

    <div class="mb-3">
      <label>Arena</label>
      <input type="text" class="form-control" th:field="*{arena}">
    </div>

    <div class="mb-3">
      <label>Country</label>
      <input type="text" class="form-control" th:field="*{country}">
    </div>

    <div class="mb-3">
      <label>Event Date</label>
      <input type="date" class="form-control" th:field="*{eventDate}">
    </div>

    <div class="mb-3">
      <label>Main Event</label>
      <input type="text" class="form-control" th:field="*{mainEvent}">
    </div>

    <div class="mb-3">
      <label>Co-Main Event</label>
      <input type="text" class="form-control" th:field="*{coMainEvent}">
    </div>

    <div class="mb-3">
      <label>Status</label>
      <select class="form-select" th:field="*{status}">
        <option value="Upcoming">Upcoming</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Poster URL</label>
      <input type="text" class="form-control" th:field="*{posterUrl}">
    </div>

    <button class="btn btn-success">
      Save Event
    </button>

    <a href="/events" class="btn btn-secondary">
      Cancel
    </a>

  </form>

</div>

</body>
</html>
