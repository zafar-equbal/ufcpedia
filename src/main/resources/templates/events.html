<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>UFCPEDIA - Events</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>🥊 UFC Events</h2>

    <a href="/add-event" class="btn btn-primary">
      + Add Event
    </a>

  </div>

  <!-- SEARCH BAR -->
  <form th:action="@{/events}" method="get" class="mb-4">

    <div class="input-group">

      <input type="text"
             name="keyword"
             class="form-control"
             placeholder="Search by event, fighter, country..."
             th:value="${keyword}">

      <button class="btn btn-dark" type="submit">
        Search
      </button>

    </div>

  </form>

  <div class="mb-4">

    <a href="/events" class="btn btn-outline-dark me-2">
      All
    </a>

    <a href="/events?status=Upcoming" class="btn btn-outline-success me-2">
      Upcoming
    </a>

    <a href="/events?status=Completed" class="btn btn-outline-secondary me-2">
      Completed
    </a>

    <a href="/events?status=Cancelled" class="btn btn-outline-danger">
      Cancelled
    </a>

  </div>

  <!-- EVENT CARDS -->
  <div class="row">

    <div class="col-md-4 mb-4"
         th:each="event : ${events}">

      <div class="card shadow-lg border-0 rounded-4 h-100">

        <div class="card-body">

          <div class="d-flex justify-content-between">

            <h4 class="fw-bold"
                th:text="${event.name}">
            </h4>

            <span class="badge rounded-pill"
                  th:classappend="${event.status == 'Upcoming'} ? 'bg-success' :
                                              (${event.status == 'Completed'} ? 'bg-secondary' : 'bg-danger')"
                  th:text="${event.status}">
                        </span>

          </div>

          <hr>

          <p>
            📍 <strong>Location:</strong>
            <span th:text="${event.location}"></span>,
            <span th:text="${event.country}"></span>
          </p>

          <p>
            🏟 <strong>Arena:</strong>
            <span th:text="${event.arena}"></span>
          </p>

          <p>
            📅 <strong>Date:</strong>
            <span th:text="${event.eventDate}"></span>
          </p>

          <hr>

          <h6>🥊 Main Event</h6>

          <p th:text="${event.mainEvent}"></p>

          <h6>🥊 Co-Main Event</h6>

          <p th:text="${event.coMainEvent}"></p>

          <hr>

          <div class="d-flex justify-content-between">

            <a class="btn btn-outline-primary btn-sm"
               th:href="@{/event/{id}(id=${event.id})}">
              View
            </a>

            <a class="btn btn-outline-warning btn-sm"
               th:href="@{/edit-event/{id}(id=${event.id})}">
              Edit
            </a>

            <a class="btn btn-outline-danger btn-sm"
               th:href="@{/delete-event/{id}(id=${event.id})}">
              Delete
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
