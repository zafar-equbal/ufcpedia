<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UFCPEDIA - Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#0b0b0b;color:#fff;overflow-x:hidden}.hero{background:linear-gradient(135deg,#111,#1b1b1b);padding:55px 0;border-bottom:2px solid #e10600}.hero h1{color:#e10600;font-weight:800}.search-box{margin-top:-28px}.event-card{background:#181818;border:1px solid #2b2b2b;border-radius:18px;overflow:hidden;transition:.3s;height:100%}.event-card:hover{transform:translateY(-8px);border-color:#e10600;box-shadow:0 0 20px rgba(225,6,0,.35)}.event-card img{height:220px;width:100%;object-fit:cover}.info{color:#d8d8d8}.filters .btn{margin:4px}@media(max-width:768px){.hero{text-align:center;padding:40px 0}.hero h1{font-size:2rem}.search-box{margin-top:20px}.filters{text-align:center}.filters .btn,.action-btn{width:100%}.event-card img{height:200px}}
  </style></head><body>
<div th:replace="fragments/navbar :: navbar"></div>
<section class="hero"><div class="container text-center"><h1> UFC Events</h1><p>Upcoming, completed and historic UFC events.</p></div></section>
<div class="container search-box"><div class="card bg-dark border-danger"><div class="card-body">
  <form th:action="@{/events}" method="get"><div class="input-group input-group-lg"><input type="text" class="form-control" name="keyword" placeholder="Search event, fighter, country..." th:value="${keyword}"><button class="btn btn-danger">Search</button></div></form>
</div></div></div>
<div class="container my-5">
  <div class="filters mb-4">
    <a href="/events" class="btn btn-outline-light">All</a>
    <a href="/events?status=Upcoming" class="btn btn-outline-success">Upcoming</a>
    <a href="/events?status=Completed" class="btn btn-outline-secondary">Completed</a>
    <a href="/events?status=Cancelled" class="btn btn-outline-danger">Cancelled</a>
  </div>
  <div class="row g-4">
    <div class="col-lg-4 col-md-6" th:each="event : ${events}">
      <div class="event-card">
        <img th:if="${event.posterUrl!=null}" th:src="${event.posterUrl}">
        <div class="p-4">
          <div class="d-flex justify-content-between"><h4 th:text="${event.name}"></h4><span class="badge" th:classappend="${event.status == 'Upcoming'} ? 'bg-success' : (${event.status == 'Completed'} ? 'bg-secondary' : 'bg-danger')" th:text="${event.status}"></span></div>
          <p class="info"> <span th:text="${event.location}"></span>, <span th:text="${event.country}"></span></p>
          <p class="info"> <span th:text="${event.arena}"></span></p>
          <p class="info"> <span th:text="${event.eventDate}"></span></p><hr class="border-danger">
          <h6 class="text-danger">Main Event</h6><p th:text="${event.mainEvent}"></p>
          <div class="row g-2">
            <div class="col-4 d-grid"><a class="btn btn-outline-light btn-sm action-btn" th:href="@{/event/{id}(id=${event.id})}">View</a></div>
          </div></div></div></div></div></div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
