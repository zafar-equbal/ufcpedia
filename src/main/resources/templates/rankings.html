<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFCPEDIA Rankings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#0b0b0b;color:#fff}
        .hero{background:linear-gradient(135deg,#111,#1a1a1a);padding:50px 0;border-bottom:2px solid #e10600}
        .hero h1{color:#e10600;font-weight:800}
        .section-title{color:#e10600;font-weight:700;margin:50px 0 20px}
        .rank-card{background:#181818;border:1px solid #2b2b2b;border-radius:18px;transition:.3s}
        .rank-card:hover{transform:translateY(-6px);border-color:#e10600;box-shadow:0 0 20px rgba(225,6,0,.35)}
        .rank{font-size:28px;font-weight:700;color:#e10600}
        .fighter-img{width:75px;height:75px;border-radius:50%;object-fit:cover;border:2px solid #e10600}
        @media(max-width:768px){
        .hero{text-align:center}.hero h1{font-size:2rem}
        .rank-card .row>div{text-align:center!important;margin-bottom:10px}
        .rank{font-size:22px}
        .fighter-img{width:70px;height:70px}
        .btn{width:100%}
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<section class="hero"><div class="container text-center"><h1> UFC Current Champions </h1><p>Official UFCPEDIA Rankings</p></div></section>
<div class="container py-5">

    <h2 class="section-title"> Flyweight</h2>
    <div th:each="fighter,stat:${flyweights}" class="rank-card p-3 mb-3">
        <div class="row align-items-center">
            <div class="col-lg-1 col-12 rank"><span></span></div>
            <div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div>
            <div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div>
            <div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div>
            <div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div>
        </div></div>


    <h2 class="section-title"> Bantamweight</h2>
    <div th:each="fighter,stat:${bantamweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

    <h2 class="section-title"> Featherweight</h2>
    <div th:each="fighter,stat:${featherweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

    <h2 class="section-title"> Lightweight</h2>
    <div th:each="fighter,stat:${lightweights}" class="rank-card p-3 mb-3">
        <div class="row align-items-center">
            <div class="col-lg-1 col-12 rank"><span></span></div>
            <div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div>
            <div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div>
            <div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div>
            <div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div>
        </div></div>

    <h2 class="section-title"> Welterweight</h2>
    <div th:each="fighter,stat:${welterweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

    <h2 class="section-title"> Middleweight</h2>
    <div th:each="fighter,stat:${middleweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

    <h2 class="section-title"> Light Heavyweight</h2>
    <div th:each="fighter,stat:${lightheavyweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

    <h2 class="section-title"> Heavyweight</h2>
    <div th:each="fighter,stat:${heavyweights}" class="rank-card p-3 mb-3"><div class="row align-items-center"><div class="col-lg-1 col-12 rank"><span></span></div><div class="col-lg-2 col-12"><img th:src="${fighter.imageUrl}" class="fighter-img"></div><div class="col-lg-5 col-12"><h4 th:text="${fighter.name}"></h4><div class="text-secondary"> <span th:text="${fighter.nationality}"></span></div></div><div class="col-lg-2 col-12"><span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark">Champion</span></div><div class="col-lg-2 col-12 d-grid"><a th:href="@{/fighter/{id}(id=${fighter.id})}" class="btn btn-danger">View</a></div></div></div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
