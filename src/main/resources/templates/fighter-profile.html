<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${fighter.name} + ' | UFCPEDIA'">UFCPEDIA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#0b0b0b;color:#fff}
        .hero{padding:60px 0}
        .profile-card{background:#181818;border:1px solid #2b2b2b;border-radius:20px;padding:30px}
        .profile-img{width:100%;max-height:560px;object-fit:cover;border-radius:20px;border:3px solid #e10600}
        .badge-red{background:#e10600}
        .info-box{background:#202020;border-radius:12px;padding:14px;height:100%}
        .stat{background:#181818;border:1px solid #333;border-radius:16px;transition:.3s}
        .stat:hover{border-color:#e10600;transform:translateY(-5px)}
        @media(max-width:991px){
        .hero{text-align:center;padding:40px 0}
        .profile-img{max-height:420px;margin-bottom:25px}
        .display-4{font-size:2.3rem}
        .btn-lg{width:100%;margin-bottom:12px}
        }
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container hero">

    <a href="/cards" class="btn btn-outline-danger mb-4">← Back to Fighters</a>

    <div class="profile-card">
        <div class="row align-items-center g-4">

            <div class="col-lg-4">
                <img th:src="${fighter.imageUrl}" class="profile-img">
            </div>

            <div class="col-lg-8">

                <span class="badge badge-red mb-3 fs-6">Fighter Profile</span>
                <span th:if="${fighter.currentChampion}" class="badge bg-warning text-dark ms-2">Current Champion</span>
                <span th:if="${fighter.hallOfFame}" class="badge bg-light text-dark ms-2">Hall of Fame</span>

                <h1 class="display-4 fw-bold mt-3" th:text="${fighter.name}"></h1>
                <h3 class="text-danger mb-4">"<span th:text="${fighter.nickname}"></span>"</h3>

                <div class="row g-3">

                    <div class="col-md-6">
                        <div class="info-box">
                            <h6 class="text-danger">Nationality</h6>
                            <p class="mb-0" th:text="${fighter.nationality}"></p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-box">
                            <h6 class="text-danger">Weight Class</h6>
                            <p class="mb-0" th:text="${fighter.weightClass}"></p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-box">
                            <h6 class="text-danger">Title</h6>
                            <p class="mb-0" th:text="${fighter.title != null ? fighter.title : 'Contender'}"></p>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="info-box">
                            <h6 class="text-danger">Professional Record</h6>
                            <p class="mb-0"><span th:text="${fighter.wins}"></span> - <span th:text="${fighter.losses}"></span> - <span th:text="${fighter.draws}"></span></p>
                        </div>
                    </div>

                </div>

                <div class="mt-4">
                    <a th:href="${fighter.aboutUrl}" target="_blank" class="btn btn-danger btn-lg">Read Full Biography</a>
                </div>

            </div>
        </div>
    </div>

</div>

<div class="container mb-5">
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card stat text-center text-white">
                <div class="card-body">
                    <h5>Wins</h5>
                    <h1 class="text-success" th:text="${fighter.wins}"></h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat text-center text-white">
                <div class="card-body">
                    <h5>Losses</h5>
                    <h1 class="text-danger" th:text="${fighter.losses}"></h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card stat text-center text-white">
                <div class="card-body">
                    <h5>Draws</h5>
                    <h1 class="text-warning" th:text="${fighter.draws}"></h1>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
