<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Fighters</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

  <h1 class="text-center mb-4">
    UFC Fighters
  </h1>

  <div class="text-end mb-3">

    <a href="/add-fighter"
       class="btn btn-success">

      Add Fighter

    </a>

  </div>

  <table class="table table-bordered table-hover table-striped">

    <thead class="table-dark">

    <tr>

      <th>ID</th>

      <th>Name</th>

      <th>Nickname</th>

      <th>Nationality</th>

      <th>Weight Class</th>

      <th>Wins</th>

      <th>Losses</th>

      <th>Draws</th>

      <th>Action</th>

    </tr>

    </thead>

    <tbody>

    <tr th:each="fighter : ${fighters}">

      <td th:text="${fighter.id}"></td>

      <td th:text="${fighter.name}"></td>

      <td th:text="${fighter.nickname}"></td>

      <td th:text="${fighter.nationality}"></td>

      <td th:text="${fighter.weightClass}"></td>

      <td th:text="${fighter.wins}"></td>

      <td th:text="${fighter.losses}"></td>

      <td th:text="${fighter.draws}"></td>

      <td>
        <a th:href="@{/edit-fighter/{id}(id=${fighter.id})}"
           class="btn btn-primary btn-sm">
          Edit
        </a>

        <a th:href="@{/delete-fighter/{id}(id=${fighter.id})}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure you want to delete this fighter?');">
          Delete
        </a>
      </td>

    </tr>

    </tbody>

  </table>

</div>

</body>
</html>
