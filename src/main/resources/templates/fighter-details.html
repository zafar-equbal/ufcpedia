<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title th:text="${fighter.name}">Fighter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#0f0f0f;
            color:white;
        }

        .fighter-card{
            background:#1b1b1b;
            border:1px solid #ff0033;
            border-radius:20px;
            overflow:hidden;
        }

        .fighter-img{
            width:100%;
            height:520px;
            object-fit:cover;
        }

        .badge-title{
            background:#ff0033;
            font-size:15px;
        }

        h1{
            font-weight:700;
        }

        .info{
            font-size:18px;
            margin-bottom:12px;
        }

        .label{
            color:#ff4d6d;
            font-weight:bold;
        }

    </style>

</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">

    <a href="/"
       class="btn btn-outline-light mb-4">

        ← Dashboard

    </a>

    <div class="card fighter-card">

        <div class="row g-0">

            <div class="col-lg-5">

                <img th:src="${fighter.imageUrl}"
                     class="fighter-img">

            </div>

            <div class="col-lg-7">

                <div class="card-body p-5">

                    <span class="badge badge-title mb-3">

                        UFC Fighter

                    </span>

                    <h1 th:text="${fighter.name}"></h1>

                    <h4 class="text-danger"
                        th:text="${fighter.weightClass}">
                    </h4>

                    <hr>

                    <p class="info">

                         <span class="label">Country:</span>

                        <span th:text="${fighter.country}"></span>

                    </p>

                    <p class="info">

                         <span class="label">Champion:</span>

                        <span th:text="${fighter.champion ? 'Yes' : 'No'}"></span>

                    </p>

                    <p class="info">

                         <span class="label">Status:</span>

                        <span th:text="${fighter.status}"></span>

                    </p>

                    <p class="info">

                        🎖 <span class="label">Nickname:</span>

                        <span th:text="${fighter.nickname}"></span>

                    </p>

                    <hr>

                    <div class="mt-4">

                        <a th:href="@{/fighters}"
                           class="btn btn-outline-light">

                            Back

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
