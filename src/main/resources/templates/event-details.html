<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title th:text="${event.name} + ' | UFCPEDIA'">
    Event Details
  </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <style>

    body{
        background:#0b0b0b;
        color:white;
        overflow-x:hidden;
    }

    /* ================= HERO ================= */

    .hero{

        background:linear-gradient(135deg,#111,#1b1b1b);

        padding:60px 0;

        border-bottom:2px solid #e10600;

    }

    .hero img{

        width:100%;

        max-height:500px;

        object-fit:cover;

        border-radius:20px;

        border:2px solid #e10600;

        box-shadow:0 0 25px rgba(225,6,0,.35);

    }

    .event-title{

        font-size:3rem;

        font-weight:800;

        color:#e10600;

    }

    .main-event{

        font-size:1.5rem;

        color:#ffffff;

        font-weight:600;

        margin-top:15px;

    }

    .status{

        display:inline-block;

        margin-top:20px;

        padding:8px 18px;

        border-radius:30px;

        font-size:15px;

        font-weight:600;

    }

    .Upcoming{

        background:#198754;

        color:white;

    }

    .Completed{

        background:#6c757d;

        color:white;

    }

    .Cancelled{

        background:#dc3545;

        color:white;

    }

    /* ================= INFO CARDS ================= */

    .info-card{

        background:#181818;

        border:1px solid #2d2d2d;

        border-radius:18px;

        transition:.3s;

        height:100%;

    }

    .info-card:hover{

        transform:translateY(-5px);

        border-color:#e10600;

        box-shadow:0 0 20px rgba(225,6,0,.35);

    }

    .info-card .card-body{

        padding:25px;

    }

    .info-title{

        color:#e10600;

        font-weight:700;

        margin-bottom:8px;

    }

    /* ================= MAIN EVENT ================= */

    .fight-card{

        background:#151515;

        border:2px solid #e10600;

        border-radius:20px;

        padding:30px;

    }

    .fight-title{

        color:#e10600;

        font-weight:bold;

        margin-bottom:20px;

    }

    .fight-text{

        font-size:1.3rem;

        font-weight:600;

        text-align:center;

    }

    /* ================= BUTTON ================= */

    .btn-ufc{

        background:#e10600;

        color:white;

    }

    .btn-ufc:hover{

        background:#b30000;

        color:white;

    }

    /* ================= MOBILE ================= */

    @media(max-width:992px){

        .hero{

            text-align:center;

        }

        .hero img{

            margin-top:30px;

        }

        .event-title{

            font-size:2.3rem;

        }

    }

    @media(max-width:768px){

        .hero{

            padding:40px 20px;

        }

        .event-title{

            font-size:2rem;

        }

        .main-event{

            font-size:1.2rem;

        }

        .btn{

            width:100%;

            margin-bottom:10px;

        }

    }

  </style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<section class="hero">

  <div class="container">

    <div class="row align-items-center">

      <div class="col-lg-7">

        <a href="/events"
           class="btn btn-outline-light mb-4">

          ← Back To Events

        </a>

        <h1 class="event-title"
            th:text="${event.name}">
        </h1>

        <h3 class="main-event"
            th:text="${event.mainEvent}">
        </h3>

        <span class="status"
              th:classappend="${event.status}"
              th:text="${event.status}">
</span>

        <div class="mt-4">

          <a class="btn btn-ufc btn-lg"
             th:href="@{/event/{id}/fighters(id=${event.id})}">

            View Event Fighters

          </a>

        </div>

      </div>

      <div class="col-lg-5 text-center">

        <img th:src="${event.posterUrl}">

      </div>

    </div>

  </div>

</section>

<div class="container my-5">

  <div class="row g-4">

    <div class="col-lg-3 col-md-6">

      <div class="info-card">

        <div class="card-body">

          <div class="info-title">

             Location

          </div>

          <p th:text="${event.location}"></p>

        </div>

      </div>

    </div>

    <div class="col-lg-3 col-md-6">

      <div class="info-card">

        <div class="card-body">

          <div class="info-title">

             Country

          </div>

          <p th:text="${event.country}"></p>

        </div>

      </div>

    </div>

    <div class="col-lg-3 col-md-6">

      <div class="info-card">

        <div class="card-body">

          <div class="info-title">

             Arena

          </div>

          <p th:text="${event.arena}"></p>

        </div>

      </div>

    </div>

    <div class="col-lg-3 col-md-6">

      <div class="info-card">

        <div class="card-body">

          <div class="info-title">

             Date

          </div>

          <p th:text="${event.eventDate}"></p>

        </div>

      </div>

    </div>

  </div>

  <div class="fight-card mt-5">

    <h2 class="fight-title">

       Main Event

    </h2>

    <div class="fight-text"
         th:text="${event.mainEvent}">
    </div>

    <div class="fight-text"
         th:text="${event.coMainEvent}">
    </div>

  </div>

</div>

<!-- ================= EVENT TIMELINE ================= -->

<div class="container my-5">

  <div class="row g-4">

    <div class="col-lg-4">

      <div class="info-card">

        <div class="card-body text-center">

          <h3 class="info-title">

             Venue

          </h3>

          <h5 th:text="${event.arena}">
          </h5>

          <p class="text-secondary">

                        <span th:text="${event.location}">
                        </span>,

            <span th:text="${event.country}">
                        </span>

          </p>

        </div>

      </div>

    </div>

    <div class="col-lg-4">

      <div class="info-card">

        <div class="card-body text-center">

          <h3 class="info-title">

             Event Date

          </h3>

          <h4 th:text="${event.eventDate}">
          </h4>

          <p class="text-secondary">

            Official Fight Night

          </p>

        </div>

      </div>

    </div>

    <div class="col-lg-4">

      <div class="info-card">

        <div class="card-body text-center">

          <h3 class="info-title">

             Status

          </h3>

          <span class="badge fs-6"
                th:classappend="${event.status == 'Upcoming'} ? 'bg-success' :
                          (${event.status == 'Completed'} ? 'bg-secondary' : 'bg-danger')"
                th:text="${event.status}">
                    </span>

        </div>

      </div>

    </div>

  </div>

</div>

<!-- ================= EVENT SUMMARY ================= -->

<div class="container mb-5">

  <div class="card info-card">

    <div class="card-body p-5">

      <h2 class="fight-title">

         Event Summary

      </h2>

      <p class="fs-5 text-light">

        <strong th:text="${event.name}">
        </strong>

        will take place at

        <strong th:text="${event.arena}">
        </strong>

        located in

        <strong>

                    <span th:text="${event.location}">
                    </span>,

          <span th:text="${event.country}">
                    </span>

        </strong>

        on

        <strong th:text="${event.eventDate}">
        </strong>.

      </p>

      <p class="text-secondary fs-5">

        The headline bout features

        <strong class="text-danger"
                th:text="${event.mainEvent}">
        </strong>



        <strong class="text-danger"
                th:text="${event.coMainEvent}">
        </strong>.

      </p>

    </div>

  </div>

</div>

<!-- ================= ACTION BUTTONS ================= -->

<div class="container mb-5">

  <div class="row g-3">

    <div class="col-md-4 d-grid">

      <a href="/events"
         class="btn btn-outline-light btn-lg">

        ← Back To Events

      </a>

    </div>

    <div class="col-md-4 d-grid">

      <a th:href="@{/event/{id}/fighters(id=${event.id})}"
         class="btn btn-danger btn-lg">

         Event Fighters

      </a>

    </div>

    <div class="col-md-4 d-grid">

      <a href="/"
         class="btn btn-warning btn-lg">

         Dashboard

      </a>

    </div>

  </div>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
