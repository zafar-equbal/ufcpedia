<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

  <title>Event Details</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

  <a href="/events" class="btn btn-secondary mb-4">
    ← Back
  </a>

  <div class="card shadow-lg">

    <div class="card-body">

      <h2 th:text="${event.name}"></h2>

      <hr>

      <p><strong>Location:</strong> <span th:text="${event.location}"></span></p>

      <p><strong>Country:</strong> <span th:text="${event.country}"></span></p>

      <p><strong>Arena:</strong> <span th:text="${event.arena}"></span></p>

      <p><strong>Date:</strong> <span th:text="${event.eventDate}"></span></p>

      <p><strong>Main Event:</strong> <span th:text="${event.mainEvent}"></span></p>

      <p><strong>Co-Main Event:</strong> <span th:text="${event.coMainEvent}"></span></p>

      <p><strong>Status:</strong> <span th:text="${event.status}"></span></p>

    </div>

  </div>

</div>

</body>

</html>
