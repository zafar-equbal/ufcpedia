<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFCPEDIA </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
     background:#0b0b0b;
     color:#fff;
     overflow-x:hidden;
 }

 .hero{
     background:linear-gradient(135deg,#111,#1b1b1b);
     padding:70px 0;
 }

 .section-title{
     color:#e10600;
     font-weight:700;
 }

 .stat-card,
 .module-card,
 .event-card,
 .fighter-card{
     background:#181818;
     border:1px solid #2b2b2b;
     border-radius:18px;
     transition:.3s;
 }

 .stat-card:hover,
 .module-card:hover,
 .event-card:hover,
 .fighter-card:hover{
     transform:translateY(-6px);
     border-color:#e10600;
     box-shadow:0 0 20px rgba(225,6,0,.35);
 }

 .card img{
     border-radius:18px 18px 0 0;
 }

 .btn-ufc{
     background:#e10600;
     color:white;
 }

 .btn-ufc:hover{
     background:#b30000;
     color:white;
 }

 .text-red{
     color:#e10600;
 }

 .hero img{
     width:100%;
     max-width:420px;
     height:auto;
 }

 .event-card img,
 .fighter-card img{
     width:100%;
 }

 /* ---------- MOBILE ---------- */

 @media (max-width:992px){

 .hero{
     text-align:center;
     padding:50px 20px;
 }

 .hero .display-3{
     font-size:2.5rem;
 }

 .hero h3{
     font-size:1.4rem;
 }

 .hero img{
     margin-top:30px;
 }

 .section-title{
     font-size:1.8rem;
 }

 }

 @media (max-width:768px){

 .hero{
     padding:40px 15px;
 }

 .hero .display-3{
     font-size:2rem;
 }

 .hero h3{
     font-size:1.2rem;
 }

 .hero p{
     font-size:1rem;
 }

 .btn-lg{
     width:100%;
     margin-bottom:12px;
 }

 .d-flex.justify-content-between{
     flex-direction:column;
     gap:15px;
     align-items:center !important;
 }

 .section-title{
     text-align:center;
 }

 }

 @media (max-width:576px){

 .hero .display-3{
     font-size:1.8rem;
 }

 .hero h3{
     font-size:1rem;
 }

 }
    </style>
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <form action="/cards" method="get">

        <div class="input-group input-group-lg">

            <input
                    type="text"
                    name="keyword"
                    class="form-control"
                    placeholder=" Search fighter, country.....">

            <button class="btn btn-danger">
                Search
            </button>

        </div>

    </form>

</div>

<!-- HERO -->
<section class="hero">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-7">
                <span class="badge bg-danger mb-3"> </span>

                <h1 class="display-3 fw-bold"
                    th:text="${featuredEvent!=null?featuredEvent.name:'No Upcoming Event'}">
                    UFC Event
                </h1>

                <h3 class="mb-4"
                    th:text="${featuredEvent!=null?featuredEvent.mainEvent:''}">
                    Main Event
                </h3>

                <p class="fs-5">
                     <span th:text="${featuredEvent!=null?featuredEvent.eventDate:''}"></span><br>
                     <span th:text="${featuredEvent!=null?featuredEvent.location:''}"></span>,
                    <span th:text="${featuredEvent!=null?featuredEvent.country:''}"></span>
                </p>

                <a th:if="${featuredEvent != null}"
                   th:href="@{/event/{id}/fighters(id=${featuredEvent.id})}"
                   class="btn btn-warning btn-lg me-lg-3 mb-2">
                    Event Fighters
                </a>

                <a th:if="${featuredEvent!=null}"
                   th:href="@{/event/{id}(id=${featuredEvent.id})}"
                   class="btn btn-outline-light btn-lg mb-2">Event Detail</a>

            </div>

            <div class="col-lg-5 text-center">
                <img th:if="${featuredEvent!=null}"
                     th:src="${featuredEvent.posterUrl}"
                     class="img-fluid rounded-4 shadow"
                     style="max-height:500px;object-fit:cover;">
            </div>
        </div>
    </div>
</section>



<div class="container my-5">

    <div class="row g-4">

        <!-- Fighters -->
        <div class="col-6 col-md-3">
            <a href="/cards" class="text-decoration-none">
                <div class="module-card p-4 text-center">
                    <h5>All Fighters</h5>
                </div>
            </a>
        </div>

        <!-- Rankings -->
        <div class="col-6 col-md-3">
            <a href="/rankings" class="text-decoration-none">
                <div class="module-card p-4 text-center">
                    <h5>Rankings</h5>
                </div>
            </a>
        </div>

        <!-- Events -->
        <div class="col-6 col-md-3">
            <a href="/events" class="text-decoration-none">
                <div class="module-card p-4 text-center">
                    <h5>Events</h5>
                </div>
            </a>
        </div>

        <!-- Hall of Fame -->
        <div class="col-6 col-md-3">
            <a href="/hall-of-fame" class="text-decoration-none">
                <div class="module-card p-4 text-center">
                    <h5>Hall Of Fame</h5>
                </div>
            </a>
        </div>

    </div>

</div>

<!-- UPCOMING EVENTS -->
<div class="container my-5">
    <div class="d-flex justify-content-between mb-4">
        <h2 class="section-title">Upcoming Events</h2>
        <a href="/events" class="btn btn-outline-danger">View All</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-4 col-md-6 mb-4" th:each="event:${upcomingEvents}">
            <div class="card event-card h-100 text-white">
                <img th:src="${event.posterUrl}" style="height:200px;object-fit:cover;">
                <div class="card-body">
                    <h4 th:text="${event.name}"></h4>
                    <p class="text-red" th:text="${event.mainEvent}"></p>
                    <p> <span th:text="${event.eventDate}"></span></p>
                    <p> <span th:text="${event.location}"></span></p>
                    <a class="btn btn-ufc"
                       th:href="@{/event/{id}(id=${event.id})}">
                        View Event
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CHAMPIONS -->
<div class="container my-5">
    <div class="d-flex justify-content-between mb-4">
        <h2 class="section-title">Featured Champions</h2>
        <a href="/rankings" class="btn btn-outline-danger">View All</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-3 col-md-6 col-sm-6 mb-4" th:each="fighter:${championsList}">
            <a th:href="@{/fighter/{id}(id=${fighter.id})}" class="text-decoration-none">
                <div class="card fighter-card h-100 text-white">
                    <img th:src="${fighter.imageUrl}" style="height:260px;object-fit:cover;">
                    <div class="card-body">
                        <h5 th:text="${fighter.name}"></h5>
                        <p class="text-red" th:text="${fighter.weightClass}"></p>
                        <p> <span th:text="${fighter.title}"></span></p>
                        <p> <span th:text="${fighter.nationality}"></span></p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- LATEST -->
<div class="container my-5">
    <div class="d-flex justify-content-between mb-4">
        <h2 class="section-title"> Fighters</h2>
        <a href="/cards" class="btn btn-outline-danger">View All</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-3 col-md-6 col-sm-6 mb-4" th:each="fighter:${latestFighters}">
            <div class="card fighter-card h-100 text-white">
                <img th:src="${fighter.imageUrl}" style="height:240px;object-fit:cover;">
                <div class="card-body text-center">
                    <h5 th:text="${fighter.name}"></h5>
                    <p th:text="${fighter.nationality}"></p>
                    <a class="btn btn-ufc"
                       th:href="@{/fighter/{id}(id=${fighter.id})}">
                        View Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===================================================== -->
<!-- TOP STORIES -->
<!-- ===================================================== -->

<div class="container mt-5 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="fw-bold text-danger">
            📰 Top Stories
        </h2>

        <a href="/news"
           class="btn btn-outline-danger">
            View All News
        </a>

    </div>

    <div class="row">

        <div class="col-lg-4 col-md-6 mb-4"
             th:each="story : ${topStories}">

            <div class="card bg-dark text-white border-danger shadow h-100">

                <img th:src="${story.imageUrl}"
                     class="card-img-top"
                     style="height:220px;object-fit:cover;">

                <div class="card-body">

                    <h5 class="fw-bold"
                        th:text="${story.title}">
                    </h5>

                    <p class="text-secondary"
                       th:text="${story.summary}">
                    </p>

                    <small class="text-danger">

                        <span th:text="${story.publishDate}">
                        </span>

                    </small>

                    <div class="mt-3">

                        <a th:href="@{/news/{id}(id=${story.id})}"
                           class="btn btn-danger btn-sm">

                            Read More

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
