<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">

    <title>News Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head><!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>News Details | UFCPEDIA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#0f0f0f;
            color:white;
            overflow-x:hidden;
        }

        .news-container{
            max-width:1000px;
        }

        .back-btn{
            transition:.3s;
        }

        .back-btn:hover{
            transform:translateX(-5px);
        }

        .news-image{
            width:100%;
            max-height:500px;
            object-fit:cover;
            border-radius:18px;
            border:2px solid #dc3545;
            box-shadow:0 0 20px rgba(220,53,69,.25);
        }

        .news-title{
            color:#dc3545;
            font-weight:700;
            margin-top:15px;
        }

        .news-meta{
            color:#b5b5b5;
            font-size:15px;
            margin-bottom:25px;
        }

        hr{
            border-color:#dc3545;
            opacity:.4;
        }

        h4{
            color:#dc3545;
            font-weight:600;
            margin-bottom:15px;
        }

        .summary{

            font-size:18px;
            line-height:1.8;

        }

        .content{

            font-size:18px;
            line-height:2;
            text-align:justify;

        }

        /* ================= TABLET ================= */

        @media (max-width:992px){

            .news-container{

                max-width:90%;

            }

            .news-image{

                max-height:420px;

            }

            .news-title{

                font-size:2.2rem;

            }

        }

        /* ================= MOBILE ================= */

        @media (max-width:768px){

            .news-container{

                max-width:100%;

                padding-left:18px;

                padding-right:18px;

            }

            .back-btn{

                width:100%;

                margin-bottom:20px;

            }

            .news-image{

                max-height:300px;

            }

            .news-title{

                font-size:1.9rem;

                text-align:center;

            }

            .news-meta{

                text-align:center;

                line-height:1.8;

            }

            h4{

                font-size:1.35rem;

            }

            .summary{

                font-size:16px;

                text-align:left;

            }

            .content{

                font-size:16px;

                line-height:1.8;

                text-align:left;

            }

        }

        /* ================= SMALL MOBILE ================= */

        @media (max-width:576px){

            .news-title{

                font-size:1.6rem;

            }

            .news-image{

                max-height:220px;

            }

            .summary{

                font-size:15px;

            }

            .content{

                font-size:15px;

            }

        }

    </style>

</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container news-container py-5">

    <a href="/news"
       class="btn btn-outline-light mb-4 back-btn">

        ← Back To News

    </a>

    <img
            th:src="${news.imageUrl}"
            class="news-image mb-4">

    <h1 class="news-title"
        th:text="${news.title}">
    </h1>

    <p class="news-meta">

         Published :

        <span th:text="${news.publishDate}">
        </span>

        &nbsp;&nbsp;|&nbsp;&nbsp;

         Source :

        <span th:text="${news.source}">
        </span>

    </p>

    <hr>

    <h4>

        Summary

    </h4>

    <p class="summary"
       th:text="${news.summary}">
    </p>

    <hr>

    <h4>

        Full Story

    </h4>

    <p class="content"
       th:text="${news.content}">
    </p>

</div>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
