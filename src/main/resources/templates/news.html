<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">

    <title>UFCPEDIA | Top Stories</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
    background:#0f0f0f;
    color:white;
    overflow-x:hidden;
}

.news-card{
    background:#181818;
    border:1px solid #dc3545;
    border-radius:18px;
    transition:.3s;
    height:100%;
}

.news-card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 20px rgba(220,53,69,.4);
}

.news-card img{
    height:230px;
    width:100%;
    object-fit:cover;
    border-radius:18px 18px 0 0;
}

/* ---------- Tablet ---------- */

@media (max-width:992px){

    .news-card img{
        height:220px;
    }

}

/* ---------- Mobile ---------- */

@media (max-width:768px){

    .container.py-5{
        padding-top:2rem !important;
        padding-bottom:2rem !important;
    }

    .d-flex.justify-content-between{
        flex-direction:column;
        gap:15px;
        align-items:center !important;
        text-align:center;
    }

    h1{
        font-size:2rem;
    }

    .input-group{
        flex-direction:column;
    }

    .input-group .form-control{
        width:100%;
        border-radius:.5rem;
        margin-bottom:10px;
    }

    .input-group .btn{
        width:100%;
        border-radius:.5rem;
    }

    .news-card img{
        height:210px;
    }

}

/* ---------- Small Phones ---------- */

@media (max-width:576px){

    h1{
        font-size:1.7rem;
    }

    .news-card img{
        height:190px;
    }

    .card-body h4{
        font-size:1.2rem;
    }

}

    </style>

</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1 class="text-danger fw-bold">
            📰 Top Stories
        </h1>

        <a href="/"
           class="btn btn-outline-light">

            Dashboard

        </a>

    </div>

    <form action="/news"
          method="get"
          class="mb-4">

        <div class="input-group">

            <input

                    type="text"

                    name="keyword"

                    class="form-control"

                    placeholder="Search News..."

                    th:value="${keyword}">

            <button class="btn btn-danger">

                Search

            </button>

        </div>

    </form>

    <div class="row">

        <div class="col-lg-4 mb-4"

             th:each="story : ${newsList}">

            <div class="card news-card h-100">

                <img th:src="${story.imageUrl}"
                     class="card-img-top">

                <div class="card-body text-white">

                    <h4 th:text="${story.title}">
                    </h4>

                    <p class="text-secondary"

                       th:text="${story.summary}">
                    </p>

                    <small class="text-danger">

                        <span th:text="${story.publishDate}">
                        </span>

                    </small>

                    <div class="mt-3">

                        <a th:href="@{/news/{id}(id=${story.id})}"

                           class="btn btn-danger">

                            Read More

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
