<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head> <link rel="icon"type="image/png" th:href="@{/images/favicon.png}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UFCPEDIA | Fighters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:#0b0b0b;color:#fff}
        .hero{background:linear-gradient(135deg,#111,#1a1a1a);padding:55px 0;border-bottom:2px solid #e10600}
        .hero h1{font-weight:800;color:#e10600}
        .search-box{margin-top:-28px}
        .fighter-card{background:#181818;border:1px solid #2d2d2d;border-radius:18px;overflow:hidden;transition:.3s;height:100%}
        .fighter-card:hover{transform:translateY(-8px);border-color:#e10600;box-shadow:0 0 20px rgba(225,6,0,.35)}
        .fighter-card img{height:320px;width:100%;object-fit:cover}
        .record{background:#202020;border-radius:10px;padding:8px;text-align:center;font-weight:bold}
        .champion-badge{background:#e10600;color:#fff;border-radius:20px;padding:5px 12px;font-size:.8rem;display:inline-block;margin-bottom:12px}
        @media(max-width:768px){.hero{text-align:center;padding:40px 0}.hero h1{font-size:2rem}.fighter-card img{height:260px}}
    </style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<section class="hero"><div class="container text-center"><h1>Ultimate Fighting Championship Fighters</h1><p class="text-light mb-0">Explore the world's best mixed martial artists.</p></div></section>
<div class="container search-box"><div class="card bg-dark border-danger shadow-lg"><div class="card-body">
    <form action="/cards" method="get"><div class="input-group input-group-lg">
        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search by name, nickname, nationality or weight class">
        <button class="btn btn-danger">Search</button>
    </div></form></div></div></div>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2 class="text-danger fw-bold">Fighter Directory</h2>
        <span class="badge bg-danger fs-6">Total Fighters : <span th:text="${fighters.size()}">0</span></span>
    </div>
    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="fighter : ${fighters}">
            <div class="fighter-card">
                <img th:src="${fighter.imageUrl}">
                <div class="p-4">
                    <span class="champion-badge" th:if="${fighter.currentChampion}">Current Champion</span>
                    <h3 class="fw-bold" th:text="${fighter.name}"></h3>
                    <p class="text-danger fw-semibold" th:text="${fighter.nickname}"></p>
                    <p> <span th:text="${fighter.nationality}"></span></p>
                    <p> <span th:text="${fighter.weightClass}"></span></p>
                    <div class="record mb-3">Record : <span th:text="${fighter.wins}"></span> - <span th:text="${fighter.losses}"></span> - <span th:text="${fighter.draws}"></span></div>
                    <div class="d-grid"><a class="btn btn-danger" th:href="@{/fighter/{id}(id=${fighter.id})}">View Profile</a></div>
                </div></div></div></div>
    <div th:if="${#lists.isEmpty(fighters)}" class="text-center my-5">
        <h2 class="text-danger">No Fighter Found</h2>
        <p class="text-secondary">Try searching with another keyword.</p>
        <a href="/" class="btn btn-outline-danger">← Back to Dashboard</a>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
